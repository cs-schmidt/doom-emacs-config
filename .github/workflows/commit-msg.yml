name: 'Lint Commit Messages'

on:
  push:
    # Lint commits pushed to any branch (including newly created branches), while skipping
    # tag-only pushes since tags contain no new commits.
    tags-ignore: ['*']
  pull_request:
    # Include 'edited' alongside default triggers so updating a PR title re-runs the check
    # (critical when using Squash and Merge, where the title becomes the commit).
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  main:
    name: Lint
    if: github.event_name == 'push' && github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --include dev

      - name: Check linting
        run: |
          LAST_SHA=${{ github.event.before }}
          NEXT_SHA=${{ github.event.after }}

          if ! git cat-file -e "$LAST_SHA^{commit}" 2>/dev/null; then
            LAST_SHA="origin/$DEFAULT_BRANCH"
          fi

          npx commitlint --from $LAST_SHA --to $NEXT_SHA

